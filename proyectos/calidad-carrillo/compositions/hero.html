<!doctype html>
<html data-composition-id="hero" data-composition-duration="3">
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: var(--ground, #0d1117);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          font-family: var(--font-display, "Plus Jakarta Sans", sans-serif);
        }
        .hero-rule {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 3px;
          background: linear-gradient(90deg, transparent, var(--brand, #38bdf8), transparent);
        }
        .hero-eyebrow {
          font-family: var(--font-mono, "JetBrains Mono", monospace);
          font-size: 28px;
          font-weight: 500;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: var(--brand, #38bdf8);
          margin-bottom: 36px;
        }
        .hero-title {
          width: 860px;
          text-align: center;
          font-size: 92px;
          line-height: 1.12;
          font-weight: 800;
          letter-spacing: -0.02em;
          color: var(--fg, #f8fafc);
        }
        .hero-sub {
          margin-top: 36px;
          font-size: 36px;
          font-weight: 500;
          color: var(--muted, #8b93a3);
        }
      </style>
      <div id="root" data-composition-id="hero" data-width="1080" data-height="1920">
        <div class="hero-rule" data-layout-ignore></div>
        <div
          id="hero-clip"
          class="clip"
          data-start="0"
          data-duration="3"
          data-track-index="0"
          style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"
        >
          <div id="hero-eyebrow" class="hero-eyebrow">Proyecto real</div>
          <h1 id="hero-title" class="hero-title">🏥 Gestión de Calidad y Seguridad Hospitalaria</h1>
          <p id="hero-sub" class="hero-sub">Panel interno para equipos de salud</p>
        </div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          // Frame 0 is the hook: the headline is already on screen, not faded up from black.
          gsap.set(["#hero-eyebrow", "#hero-title", "#hero-sub"], { opacity: 1 });
          gsap.set("#hero-eyebrow", { y: 0 });
          gsap.set("#hero-title", { y: 0, filter: "blur(0px)" });
          gsap.set("#hero-sub", { opacity: 0, y: 16 });

          tl.fromTo(
            "#hero-title",
            { filter: "blur(4px)" },
            { filter: "blur(0px)", duration: 0.4, ease: "power3.out" },
            0,
          );
          tl.to("#hero-sub", { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" }, 0.3);

          tl.to(
            ["#hero-eyebrow", "#hero-title", "#hero-sub"],
            { opacity: 0, duration: 0.3, ease: "power1.in" },
            2.65,
          );

          tl.seek(0);
          window.__timelines["hero"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
