<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 400;
        src: url("assets/fonts/PlusJakartaSans-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 600;
        src: url("assets/fonts/PlusJakartaSans-SemiBold.ttf") format("truetype");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 700;
        src: url("assets/fonts/PlusJakartaSans-Bold.ttf") format("truetype");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 800;
        src: url("assets/fonts/PlusJakartaSans-ExtraBold.ttf") format("truetype");
      }

      :root {
        --ground: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --brand: #38bdf8;
        --accent: #2563eb;
        --fg: #f8fafc;
        --muted: #8b93a3;
        --font-display: "Plus Jakarta Sans", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--ground);
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="hero"
        data-composition-id="hero"
        data-composition-src="compositions/hero.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div

        data-height="1920"
      ></div>

      <div

        data-height="1920"
      ></div>

      <div

      <audio
        id="bgm"

        data-start="0"
        data-duration="30"
        data-media-start="12.385"
        data-volume="1"
        data-fade-in="0.4"

</html>
