<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 400;
        src: url("assets/fonts/PlusJakartaSans-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 600;
        src: url("assets/fonts/PlusJakartaSans-SemiBold.ttf") format("truetype");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 700;
        src: url("assets/fonts/PlusJakartaSans-Bold.ttf") format("truetype");
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 800;
        src: url("assets/fonts/PlusJakartaSans-ExtraBold.ttf") format("truetype");
      }

      :root {
        --ground: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --brand: #38bdf8;
        --accent: #2563eb;
        --fg: #f8fafc;
        --muted: #8b93a3;
        --font-display: "Plus Jakarta Sans", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--ground);
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
                                                            <div id="hero" data-composition-id="hero" data-composition-src="compositions/hero.html"
        data-start="0" data-duration="2.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="k1" data-composition-id="k1" data-composition-src="compositions/k1.html"
        data-start="2.5" data-duration="2.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="k2" data-composition-id="k2" data-composition-src="compositions/k2.html"
        data-start="5" data-duration="2.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="k3" data-composition-id="k3" data-composition-src="compositions/k3.html"
        data-start="7.5" data-duration="2.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="k4" data-composition-id="k4" data-composition-src="compositions/k4.html"
        data-start="10" data-duration="2.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="k5" data-composition-id="k5" data-composition-src="compositions/k5.html"
        data-start="12.5" data-duration="2.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="15" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <audio id="bgm" class="clip" data-start="0" data-duration="20" data-media-start="15" data-volume="1"
        data-fade-in="0.2" data-fade-out="1.4" data-track-index="0" src="assets/bgm.wav"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
